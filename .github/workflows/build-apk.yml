name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK, GitHub runner imajında hazır geliyor; yalnızca lisansları kabul ediyoruz.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug and release APKs
        run: gradle --no-daemon assembleDebug assembleRelease --stacktrace

      - name: Print Room schema
        if: always()
        run: |
          echo "SCHEMA-BEGIN"
          cat app/schemas/com.atlas.app.data.db.AtlasDatabase/2.json || true
          echo "SCHEMA-END"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
